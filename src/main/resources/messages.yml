inventory-full: "%prefix%&cYour inventory is full! Remaining duplicates were not dropped."
guide-title: "&8&m----------------------------------------"
guide-step-1: "%prefix%&b1/5 &fDownload the plugin from the Downloads page."
guide-step-2: "%prefix%&b2/5 &fPut the JAR in your server's &bplugins &ffolder, then restart the server."
guide-step-3: "%prefix%&b3/5 &fSet &bmax-dupe-amount &fin &bconfig.yml&f. Set &bdrop-overflow-items: true &fto drop overflow instead of showing a full-inventory message."
guide-step-4: "%prefix%&b4/5 &fHold an item and run &b/dupe [amount]&f. Grant &bsimpledupe.dupe.8 &fto allow up to 8 copies."
guide-step-5: "%prefix%&b5/5 &fEdit &bmessages.yml &for &bconfig.yml&f, then run &b/simpledupereload &fto apply changes."
guide-website: "%prefix%&bWebsite: &fhttps://simpledupe.github.io/ &7(click to open)"
guide-footer: "&8&m----------------------------------------"
