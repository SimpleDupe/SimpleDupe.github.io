name: Website request
description: Suggest a website feature or report a website issue
title: "[Website] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for ideas or issues related to the SimpleDupe website. No Minecraft username is needed.
  - type: input
    id: contact
    attributes:
      label: Contact email or Discord username
      description: At least one contact method is required. Enter an email or Discord username here.
      placeholder: name@example.com or username
    validations:
      required: true
  - type: input
    id: discord_username
    attributes:
      label: Discord username
      description: Optional if you entered your Discord username in the contact field.
      placeholder: username
    validations:
      required: false
  - type: dropdown
    id: website_area
    attributes:
      label: Website page or area
      options:
        - Home
        - Features
        - Downloads
        - Setup
        - Permissions
        - Requests
        - Other
    validations:
      required: true
  - type: input
    id: website_idea
    attributes:
      label: Website idea or issue
      description: Summarize the change or problem.
      placeholder: Add a compatibility table
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Detailed description and questions
      description: Describe what you expected, what happened, or what you would like to see.
      placeholder: Include steps to reproduce problems and links or screenshots when useful.
      render: markdown
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: Optional. Helpful for display or interaction issues.
      placeholder: Chrome on Windows 11
    validations:
      required: false
