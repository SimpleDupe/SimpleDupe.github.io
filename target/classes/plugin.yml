name: SimpleDupe
version: 1.0.4
main: com.skitmc.simpledupe.SimpleDupe
api-version: 1.20
author: Skitxoe
description: A lightweight, customizable item duplication plugin.

commands:
  dupe:
    description: Duplicates the item in your main hand.
  simpledupereload:
    description: Reloads the SimpleDupe configurations and messages.
    aliases: [dupereload]
  simpledupeguide:
    description: Shows operators the SimpleDupe setup guide.

permissions:
  # Numeric nodes such as simpledupe.dupe.8 grant a per-player maximum of 8.
  simpledupe.use:
    description: Allows players to duplicate items using /dupe.
    default: true
  simpledupe.admin:
    description: Allows admins to reload the plugin configuration using /simpledupereload.
    default: op
  simpledupe.guide:
    description: Allows operators to view the SimpleDupe setup guide.
    default: op