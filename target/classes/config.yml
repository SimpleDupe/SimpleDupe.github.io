# ============================================================
# SimpleDupe Configuration
# ============================================================
# Edit this file, then run /simpledupereload.

# ------------------------------------------------------------
# Duplication Limit
# ------------------------------------------------------------
# Maximum number of copies one /dupe command can create.
max-dupe-amount: 5

# ------------------------------------------------------------
# Inventory Overflow
# ------------------------------------------------------------
# false: keep overflow from duplicating and show an inventory-full message.
# true:  drop overflow items at the player's location.
drop-overflow-items: false

# ------------------------------------------------------------
# Item Blacklist
# ------------------------------------------------------------
# Add any type of block you want to protect. Add one item per line.
blacklist:
  materials:
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK
    - STRUCTURE_BLOCK
    - JIGSAW

  # Exact custom item names. Remove the # to enable an example.
  # Names support legacy colors (&a), hex colors (&#42e8e0), and MiniMessage.
  names:
      - "&cAdmin Sword"

  # Enchantment names, or ENCHANTMENT:LEVEL to block that level and above.
  enchantments:
      - "sharpness:5"
      - "unbreaking:3"
      - "mending:1"

  # Exact lore lines. Remove the # to enable an example.
  lore:
      - "&7Event Reward"
      - "&#42e8e0Limited Edition"