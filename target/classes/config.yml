# SimpleDupe configuration

# Maximum number of items a player can duplicate at once.
max-dupe-amount: 5

# Drop overflow items when a player's inventory is full.
drop-overflow-items: false

# Items matching any entry below cannot be duplicated.
# Names and lore support legacy colors, hex codes, and MiniMessage formatting.
blacklist:
  materials:
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK
    - STRUCTURE_BLOCK
    - JIGSAW
  names: []
  # Use an enchantment key, or KEY:LEVEL to block that level and higher.
  enchantments: []
  lore: []